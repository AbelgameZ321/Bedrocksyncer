name: Build BedrockSync

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Check for Gradle wrapper JAR
        id: wrapper
        run: |
          if [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      # Only used to create the wrapper when the JAR is missing from the repo.
      - name: Set up Gradle 9.3.1 (bootstrap only)
        if: steps.wrapper.outputs.present == 'false'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Generate Gradle wrapper
        if: steps.wrapper.outputs.present == 'false'
        run: gradle wrapper --gradle-version 9.3.1 --no-daemon

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build with ./gradlew build
        run: ./gradlew build --no-daemon --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: bedrocksync-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
          
